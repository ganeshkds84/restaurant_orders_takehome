# Render Blueprint Specification
# Reference: https://render.com/docs/blueprint-spec

services:
  # 1. Express Backend Web Service
  - type: web
    name: restaurant-orders-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm install --prefix server --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-orders-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h

  # 2. React / Vite Frontend Static Site
  - type: web
    name: restaurant-orders-client
    runtime: static
    buildCommand: npm install && npm install --prefix client && npm run build:client
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  # 3. Managed PostgreSQL Database
  - name: restaurant-orders-db
    plan: free
    region: oregon
    databaseName: restaurant_orders